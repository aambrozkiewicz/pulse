# Zastąp analytics.twojadomena.pl własną domeną.
# Skopiuj do /etc/nginx/sites-available/pulse i włącz w sites-enabled.
# Po nginx -t i przeładowaniu uruchom:
# sudo certbot --nginx -d analytics.twojadomena.pl --redirect
# Certbot doda certyfikat, obsługę HTTPS i przekierowanie HTTP -> HTTPS.
server {
    listen 80;
    listen [::]:80;

    server_name analytics.twojadomena.pl;

    server_tokens off;
    client_max_body_size 16k;

    access_log /var/log/nginx/pulse.access.log;
    error_log /var/log/nginx/pulse.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering off;
        proxy_cache off;
    }
}
